# Copy to .github/workflows/codex-pr-review.yml in each repository.
# Needs the repository secret OPENAI_API_KEY.
name: Codex PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    uses: godisabug/workflows/.github/workflows/codex-pr-review.yml@v1
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    # Optional:
    # with:
    #   model: ""
    #   effort: medium
    #   max-priority: 2
    #   extra-instructions: |
    #     Parsers must never panic on malformed input files.
