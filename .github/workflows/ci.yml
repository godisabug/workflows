name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/codex-pr-review.yml .github/workflows/ci.yml templates/codex-pr-review.yml
      - name: Test post-review script
        run: node --test test/*.test.mjs
