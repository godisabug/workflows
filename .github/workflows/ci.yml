name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint's bundled metadata for openai/codex-action@v1 predates the
      # permission-profile input (added in codex-action v1.10).
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            -color
            -ignore=permission-profile
            .github/workflows/codex-pr-review.yml
            .github/workflows/ci.yml
            templates/codex-pr-review.yml
      - name: Test post-review script
        run: node --test test/*.test.mjs
